<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Persona Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0e0e12; --surface:#16161c; --surface2:#1e1e28;
      --border:#2a2a35; --text:#e8e8f0; --muted:#6b6b80;
      --accent:#7c6af7; --accent-glow:rgba(124,106,247,0.15); --accent-border:rgba(124,106,247,0.4);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;height:100vh;display:flex;overflow:hidden;transition:background 0.4s;}

    aside{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
    .sidebar-scroll{flex:1;overflow-y:auto;padding:20px 12px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .sidebar-bottom{padding:12px;border-top:1px solid var(--border);}
    .s-label{font-family:'Syne',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);padding:0 8px 10px;display:block;}

    .persona-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;text-align:left;transition:all 0.2s;width:100%;margin-bottom:3px;}
    .persona-btn:hover{background:var(--accent-glow);color:var(--text);}
    .persona-btn.active{background:var(--accent-glow);border-color:var(--accent-border);color:var(--text);}
    .p-emoji{font-size:1.15rem;} .p-info{display:flex;flex-direction:column;gap:1px;}
    .p-name{font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:600;}
    .p-tag{font-size:0.62rem;color:var(--muted);line-height:1.3;}
    .persona-btn.active .p-tag{color:var(--accent);opacity:0.85;}

    .history-section{margin-top:12px;}
    .history-list{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;max-height:160px;overflow-y:auto;}
    .session-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;transition:all 0.2s;width:100%;text-align:left;}
    .session-item:hover{background:var(--surface2);border-color:var(--border);}
    .session-item.active-session{background:var(--surface2);border-color:var(--accent-border);}
    .session-info{flex:1;min-width:0;}
    .session-label{font-size:0.75rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Syne',sans-serif;}
    .session-meta{font-size:0.6rem;color:var(--muted);margin-top:1px;}
    .session-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;padding:2px 4px;border-radius:4px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
    .session-item:hover .session-del{opacity:1;}
    .session-del:hover{color:#e05c5c;}
    .no-sessions{font-size:0.72rem;color:var(--muted);padding:6px 10px;font-style:italic;}

    .theme-section{margin-top:10px;padding-top:12px;border-top:1px solid var(--border);}
    .color-presets{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px;}
    .color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s,border-color 0.15s;}
    .color-dot:hover{transform:scale(1.2);}
    .color-dot.selected{border-color:white;transform:scale(1.15);}
    .custom-row{display:flex;align-items:center;gap:8px;padding:0 8px 8px;}
    .custom-row label{font-size:0.68rem;color:var(--muted);}
    input[type="color"]{width:26px;height:26px;border:1px solid var(--border);border-radius:5px;background:none;cursor:pointer;padding:2px;}
    .reset-color{background:none;border:1px solid var(--border);color:var(--muted);font-size:0.63rem;padding:3px 7px;border-radius:5px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;margin-left:auto;}
    .reset-color:hover{color:var(--text);border-color:var(--accent);}

    .action-btns{display:flex;gap:6px;padding:0 4px;}
    .action-btn{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:0.68rem;padding:7px 6px;border-radius:7px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;text-align:center;}
    .action-btn:hover{color:var(--text);border-color:var(--accent-border);background:var(--accent-glow);}
    .action-btn.primary{background:var(--accent-glow);border-color:var(--accent-border);color:var(--text);}

    main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-header{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
    .active-persona{display:flex;align-items:center;gap:12px;}
    .active-emoji{width:40px;height:40px;border-radius:10px;background:var(--accent-glow);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:background 0.3s,border-color 0.3s;}
    .active-name{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;}
    .active-tag{font-size:0.7rem;color:var(--muted);margin-top:2px;}
    .header-right{display:flex;align-items:center;gap:8px;}

    /* TTS TOGGLE */
    .tts-toggle{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;transition:all 0.2s;user-select:none;}
    .tts-toggle:hover{border-color:var(--accent-border);}
    .tts-toggle.active{border-color:var(--accent-border);background:var(--accent-glow);}
    .tts-icon{font-size:0.9rem;}
    .tts-label{font-size:0.68rem;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600;letter-spacing:0.05em;}
    .tts-toggle.active .tts-label{color:var(--text);}
    .toggle-pill{width:26px;height:14px;border-radius:7px;background:var(--border);position:relative;transition:background 0.2s;flex-shrink:0;}
    .tts-toggle.active .toggle-pill{background:var(--accent);}
    .toggle-knob{width:10px;height:10px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:transform 0.2s;}
    .tts-toggle.active .toggle-knob{transform:translateX(12px);}

    .autosave-badge{font-size:0.62rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:3px 8px;border-radius:5px;transition:all 0.3s;}
    .autosave-badge.saved{color:#6abf8a;border-color:rgba(106,191,138,0.4);}
    .hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;font-size:0.7rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
    .hdr-btn:hover{border-color:var(--accent);color:var(--text);}

    #chat-box{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .welcome{text-align:center;margin:auto;padding:40px 20px;}
    .welcome-emoji{font-size:2.8rem;display:block;margin-bottom:12px;}
    .welcome h2{font-family:'Syne',sans-serif;font-size:1.35rem;margin-bottom:8px;}
    .welcome p{color:var(--muted);font-size:0.85rem;line-height:1.6;}

    .message{display:flex;gap:11px;animation:fadeUp 0.3s ease forwards;opacity:0;max-width:820px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .message.user{flex-direction:row-reverse;align-self:flex-end;}
    .msg-avatar{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0;margin-top:2px;}
    .message.bot .msg-avatar{background:var(--accent-glow);border:1px solid var(--accent-border);}
    .message.user .msg-avatar{background:var(--surface2);border:1px solid var(--border);}

    .msg-content{display:flex;flex-direction:column;gap:5px;max-width:680px;}
    .msg-bubble{padding:11px 15px;border-radius:11px;font-size:0.88rem;line-height:1.75;}
    .message.bot .msg-bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px;}
    .message.user .msg-bubble{background:var(--accent);color:white;border-top-right-radius:3px;transition:background 0.3s;}

    /* TTS CONTROLS per message */
    .msg-tts{display:flex;align-items:center;gap:6px;padding:0 2px;}
    .play-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 10px;font-size:0.7rem;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:all 0.2s;}
    .play-btn:hover{border-color:var(--accent-border);color:var(--text);background:var(--accent-glow);}
    .play-btn.playing{border-color:var(--accent-border);color:var(--accent);background:var(--accent-glow);}
    .play-btn.loading{opacity:0.5;cursor:wait;}
    .sound-wave{display:flex;align-items:center;gap:2px;height:12px;}
    .sound-wave span{width:2px;border-radius:1px;background:var(--accent);animation:wave 0.8s ease-in-out infinite;}
    .sound-wave span:nth-child(1){height:4px;animation-delay:0s;}
    .sound-wave span:nth-child(2){height:10px;animation-delay:0.1s;}
    .sound-wave span:nth-child(3){height:6px;animation-delay:0.2s;}
    .sound-wave span:nth-child(4){height:10px;animation-delay:0.3s;}
    .sound-wave span:nth-child(5){height:4px;animation-delay:0.4s;}
    @keyframes wave{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

    .typing-dots{display:flex;gap:5px;align-items:center;padding:3px 2px;}
    .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.3s ease-in-out infinite;}
    .typing-dots span:nth-child(2){animation-delay:0.15s}.typing-dots span:nth-child(3){animation-delay:0.3s}
    @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.3}40%{transform:scale(1);opacity:1}}

    .input-area{padding:12px 22px 16px;border-top:1px solid var(--border);}
    .input-row{display:flex;gap:9px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 13px;transition:border-color 0.2s;}
    .input-row:focus-within{border-color:var(--accent-border);}
    textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:0.88rem;font-weight:300;resize:none;min-height:24px;max-height:120px;line-height:1.5;}
    textarea::placeholder{color:var(--muted);}
    .send-btn{background:var(--accent);border:none;border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.85rem;flex-shrink:0;color:white;transition:opacity 0.2s,transform 0.1s,background 0.3s;}
    .send-btn:hover{opacity:0.85;}.send-btn:active{transform:scale(0.93);}.send-btn:disabled{opacity:0.3;cursor:not-allowed;}
    .input-hint{font-size:0.65rem;color:var(--muted);margin-top:6px;padding:0 2px;}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);animation:fadeIn 0.2s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
    .modal h3{font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px;}
    .modal input[type="text"]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.2s;}
    .modal input[type="text"]:focus{border-color:var(--accent-border);}
    .modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
    .modal-btn{padding:8px 18px;border-radius:7px;font-size:0.8rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;border:1px solid var(--border);}
    .modal-btn.cancel{background:none;color:var(--muted);}.modal-btn.cancel:hover{color:var(--text);}
    .modal-btn.confirm{background:var(--accent);border-color:var(--accent);color:white;}.modal-btn.confirm:hover{opacity:0.85;}
  </style>
</head>
<body>

<aside>
  <div class="sidebar-scroll">
    <span class="s-label">Personas</span>
    <div id="persona-list"></div>
    <div class="history-section">
      <span class="s-label">Saved Chats</span>
      <div class="history-list" id="history-list"><div class="no-sessions">No saved chats yet</div></div>
    </div>
    <div class="theme-section">
      <span class="s-label">Theme Color</span>
      <div class="color-presets" id="color-presets"></div>
      <div class="custom-row">
        <label>Custom</label>
        <input type="color" id="custom-color" value="#7c6af7"/>
        <button class="reset-color" id="reset-color-btn">↺ Reset</button>
      </div>
    </div>
  </div>
  <div class="sidebar-bottom">
    <div class="action-btns">
      <button class="action-btn" id="new-chat-btn">＋ New</button>
      <button class="action-btn primary" id="save-btn">💾 Save</button>
    </div>
  </div>
</aside>

<main>
  <div class="chat-header">
    <div class="active-persona">
      <div class="active-emoji" id="header-emoji">🧙</div>
      <div>
        <div class="active-name" id="header-name">Sage</div>
        <div class="active-tag" id="header-tag">Wise Mentor & Guide</div>
      </div>
    </div>
    <div class="header-right">
      <!-- TTS TOGGLE -->
      <div class="tts-toggle" id="tts-toggle" title="Auto-speak replies">
        <span class="tts-icon">🔊</span>
        <span class="tts-label">TTS</span>
        <div class="toggle-pill"><div class="toggle-knob"></div></div>
      </div>
      <span class="autosave-badge" id="autosave-badge">● autosave on</span>
      <button class="hdr-btn" id="clear-btn">✦ Clear</button>
    </div>
  </div>

  <div id="chat-box">
    <div class="welcome" id="welcome-msg">
      <span class="welcome-emoji">🧙</span>
      <h2>Hello, I'm Sage</h2>
      <p>Wise Mentor & Guide — ask me anything.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">➤</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</main>

<script>
  let currentPersona = 'wise_mentor';
  let personas = {};
  let userOverrideColor = null;
  let sessionId = newSessionId();
  let activeSessionId = null;
  let ttsEnabled = false;
  let currentAudio = null;
  let currentPlayBtn = null;

  const personaColors = {
    wise_mentor:       {accent:'#c9a84c',bg:'#0f0e0a'},
    sarcastic_friend:  {accent:'#e05c5c',bg:'#0f0a0a'},
    science_explainer: {accent:'#4ca8e0',bg:'#090d12'},
    zen_coach:         {accent:'#6abf8a',bg:'#090f0c'},
    socratic:          {accent:'#a87cd4',bg:'#0c0a10'},
  };
  const presets = ['#7c6af7','#c9a84c','#e05c5c','#4ca8e0','#6abf8a','#a87cd4','#e07a3a','#3abfbf','#e0b84c','#c45c9e'];

  function newSessionId() { return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19); }
  function hexToRgb(hex) { return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(','); }

  function applyAccent(hex, bgOverride) {
    const rgb = hexToRgb(hex);
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-glow', `rgba(${rgb},0.15)`);
    document.documentElement.style.setProperty('--accent-border', `rgba(${rgb},0.4)`);
    if (bgOverride) document.documentElement.style.setProperty('--bg', bgOverride);
    document.getElementById('custom-color').value = hex;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('selected', d.dataset.color === hex));
  }

  function buildPresets() {
    const c = document.getElementById('color-presets');
    presets.forEach(color => {
      const dot = document.createElement('div');
      dot.className = 'color-dot'; dot.dataset.color = color;
      dot.style.background = color; dot.title = color;
      dot.addEventListener('click', () => { userOverrideColor = color; applyAccent(color, null); });
      c.appendChild(dot);
    });
  }

  document.getElementById('custom-color').addEventListener('input', e => {
    userOverrideColor = e.target.value; applyAccent(e.target.value, null);
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  });

  document.getElementById('reset-color-btn').addEventListener('click', () => {
    userOverrideColor = null;
    const c = personaColors[currentPersona] || {accent:'#7c6af7',bg:'#0e0e12'};
    applyAccent(c.accent, c.bg);
  });

  // ── TTS TOGGLE ──
  const ttsToggle = document.getElementById('tts-toggle');
  ttsToggle.addEventListener('click', () => {
    ttsEnabled = !ttsEnabled;
    ttsToggle.classList.toggle('active', ttsEnabled);
  });

  async function speakText(text, btn) {
    // Stop any currently playing audio
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
      if (currentPlayBtn) {
        currentPlayBtn.classList.remove('playing');
        currentPlayBtn.innerHTML = '▶ Play';
      }
      if (btn === currentPlayBtn) { currentPlayBtn = null; return; }
    }

    btn.classList.add('loading');
    btn.innerHTML = '⏳ Loading';

    try {
      const res = await fetch('/tts', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({text, persona: currentPersona})
      });

      if (!res.ok) {
        const err = await res.json();
        btn.classList.remove('loading');
        btn.innerHTML = '⚠ Error';
        setTimeout(() => { btn.innerHTML = '▶ Play'; }, 2000);
        console.error('TTS error:', err);
        return;
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;
      currentPlayBtn = btn;

      btn.classList.remove('loading');
      btn.classList.add('playing');
      btn.innerHTML = '<div class="sound-wave"><span></span><span></span><span></span><span></span><span></span></div> Stop';

      audio.play();
      audio.onended = () => {
        btn.classList.remove('playing');
        btn.innerHTML = '▶ Play';
        currentAudio = null; currentPlayBtn = null;
        URL.revokeObjectURL(url);
      };
    } catch (e) {
      btn.classList.remove('loading');
      btn.innerHTML = '⚠ Error';
      setTimeout(() => { btn.innerHTML = '▶ Play'; }, 2000);
    }
  }

  // ── PERSONAS ──
  async function loadPersonas() {
    const res = await fetch('/personas');
    personas = await res.json();
    renderSidebar(); buildPresets();
    const c = personaColors[currentPersona];
    if (c) applyAccent(c.accent, c.bg);
    loadHistory();
  }

  function renderSidebar() {
    const list = document.getElementById('persona-list');
    list.innerHTML = '';
    for (const [key, p] of Object.entries(personas)) {
      const btn = document.createElement('button');
      btn.className = 'persona-btn' + (key === currentPersona ? ' active' : '');
      btn.dataset.key = key;
      btn.innerHTML = `<span class="p-emoji">${p.emoji}</span><div class="p-info"><span class="p-name">${p.name}</span><span class="p-tag">${p.tagline}</span></div>`;
      btn.addEventListener('click', () => switchPersona(key));
      list.appendChild(btn);
    }
  }

  function switchPersona(key) {
    currentPersona = key; activeSessionId = null;
    const p = personas[key];
    document.querySelectorAll('.persona-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    document.getElementById('header-emoji').textContent = p.emoji;
    document.getElementById('header-name').textContent = p.name;
    document.getElementById('header-tag').textContent = p.tagline;
    sessionId = newSessionId();
    showWelcome(p);
    if (userOverrideColor) applyAccent(userOverrideColor, null);
    else { const c = personaColors[key] || {accent:'#7c6af7',bg:'#0e0e12'}; applyAccent(c.accent, c.bg); }
    loadHistory(); userInput.focus();
  }

  function showWelcome(p) {
    chatBox.innerHTML = `<div class="welcome" id="welcome-msg">
      <span class="welcome-emoji">${p.emoji}</span>
      <h2>Hello, I'm ${p.name}</h2>
      <p>${p.tagline} — ask me anything.</p>
    </div>`;
  }

  // ── HISTORY ──
  async function loadHistory() {
    const res = await fetch(`/sessions?persona=${currentPersona}`);
    renderHistory(await res.json());
  }

  function renderHistory(sessions) {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if (!sessions.length) { list.innerHTML = '<div class="no-sessions">No saved chats yet</div>'; return; }
    sessions.forEach(s => {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.session_id === activeSessionId ? ' active-session' : '');
      const date = new Date(s.saved_at).toLocaleDateString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      item.innerHTML = `<div class="session-info"><div class="session-label">${s.label}</div><div class="session-meta">${s.message_count} msgs · ${date}</div></div>
        <button class="session-del" data-id="${s.session_id}">✕</button>`;
      item.addEventListener('click', e => { if (!e.target.classList.contains('session-del')) loadSession(s.session_id, s.label); });
      item.querySelector('.session-del').addEventListener('click', () => deleteSession(s.session_id));
      list.appendChild(item);
    });
  }

  async function loadSession(sid, label) {
    const res = await fetch('/load', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:currentPersona,session_id:sid})});
    const data = await res.json();
    if (data.error) return;
    activeSessionId = sid; sessionId = sid;
    chatBox.innerHTML = '';
    data.messages.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'bot', m.content));
    chatBox.scrollTop = chatBox.scrollHeight;
    loadHistory(); flashSaved(`Loaded: ${label}`);
  }

  async function deleteSession(sid) {
    await fetch('/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:currentPersona,session_id:sid})});
    if (sid === activeSessionId) { activeSessionId = null; sessionId = newSessionId(); }
    loadHistory();
  }

  // ── SAVE MODAL ──
  document.getElementById('save-btn').addEventListener('click', () => {
    if (!chatBox.querySelector('.message')) return flashSaved('Nothing to save yet');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const defaultLabel = `Chat ${new Date().toLocaleDateString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;
    overlay.innerHTML = `<div class="modal"><h3>💾 Save Conversation</h3>
      <input type="text" id="save-label-input" value="${defaultLabel}"/>
      <div class="modal-btns"><button class="modal-btn cancel" id="modal-cancel">Cancel</button><button class="modal-btn confirm" id="modal-confirm">Save</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#save-label-input').select();
    overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#modal-confirm').addEventListener('click', async () => {
      const label = overlay.querySelector('#save-label-input').value.trim() || defaultLabel;
      overlay.remove(); await manualSave(label);
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  });

  async function manualSave(label) {
    const res = await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:currentPersona,session_id:sessionId,label})});
    const data = await res.json();
    if (!data.error) { flashSaved(`Saved: ${data.label}`); loadHistory(); }
  }

  function flashSaved(msg) {
    const badge = document.getElementById('autosave-badge');
    badge.textContent = '✓ ' + msg; badge.classList.add('saved');
    setTimeout(() => { badge.textContent = '● autosave on'; badge.classList.remove('saved'); }, 2500);
  }

  // ── CHAT ──
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function appendMessage(role, text) {
    document.getElementById('welcome-msg')?.remove();
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? (personas[currentPersona]?.emoji || '🤖') : '✦';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    content.appendChild(bubble);

    // Add TTS play button for bot messages
    if (role === 'bot') {
      const ttsRow = document.createElement('div');
      ttsRow.className = 'msg-tts';
      const playBtn = document.createElement('button');
      playBtn.className = 'play-btn';
      playBtn.innerHTML = '▶ Play';
      playBtn.addEventListener('click', () => speakText(text, playBtn));
      ttsRow.appendChild(playBtn);
      content.appendChild(ttsRow);
    }

    msg.appendChild(avatar);
    msg.appendChild(content);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return { bubble, content };
  }

  function showTyping() {
    document.getElementById('welcome-msg')?.remove();
    const msg = document.createElement('div');
    msg.className = 'message bot'; msg.id = 'typing';
    const avatar = document.createElement('div'); avatar.className = 'msg-avatar';
    avatar.textContent = personas[currentPersona]?.emoji || '🤖';
    const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    msg.appendChild(avatar); msg.appendChild(bubble);
    chatBox.appendChild(msg); chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    appendMessage('user', text);
    userInput.value = ''; userInput.style.height = 'auto';
    sendBtn.disabled = true; showTyping();
    try {
      const res = await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,persona:currentPersona,session_id:sessionId})});
      const data = await res.json();
      removeTyping();
      const {content} = appendMessage('bot', data.response || 'Something went wrong.');
      flashSaved('autosaved'); loadHistory();

      // Auto-speak if TTS is enabled
      if (ttsEnabled && data.response) {
        const playBtn = content.querySelector('.play-btn');
        if (playBtn) speakText(data.response, playBtn);
      }
    } catch {
      removeTyping();
      appendMessage('bot', 'Connection error. Is Ollama running?');
    }
    sendBtn.disabled = false; userInput.focus();
  }

  document.getElementById('new-chat-btn').addEventListener('click', async () => {
    await fetch('/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:currentPersona})});
    sessionId = newSessionId(); activeSessionId = null;
    showWelcome(personas[currentPersona]); loadHistory();
  });

  document.getElementById('clear-btn').addEventListener('click', async () => {
    await fetch('/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:currentPersona})});
    sessionId = newSessionId(); activeSessionId = null;
    showWelcome(personas[currentPersona]);
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });
  userInput.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  sendBtn.addEventListener('click', sendMessage);

  loadPersonas();
</script>
</body>
</html>
