<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Persona Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0e12;
      --surface: #16161c;
      --border: #2a2a35;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */
    aside {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 12px;
      gap: 6px;
    }

    .sidebar-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 8px 12px;
    }

    .persona-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      width: 100%;
    }

    .persona-btn:hover {
      background: var(--accent-glow);
      color: var(--text);
    }

    .persona-btn.active {
      background: var(--accent-glow);
      border-color: rgba(124,106,247,0.4);
      color: var(--text);
    }

    .persona-btn .p-emoji { font-size: 1.2rem; }

    .persona-btn .p-info { display: flex; flex-direction: column; gap: 1px; }
    .persona-btn .p-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .persona-btn .p-tag {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.3;
    }
    .persona-btn.active .p-tag { color: rgba(124,106,247,0.8); }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .active-persona {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .active-emoji {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--accent-glow);
      border: 1px solid rgba(124,106,247,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }

    .active-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .active-tag {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--text); }

    /* CHAT BOX */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
    }

    .welcome-emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
    .welcome h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .welcome p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; }

    /* MESSAGES */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeUp 0.3s ease forwards;
      opacity: 0;
      max-width: 800px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; align-self: flex-end; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.bot .msg-avatar {
      background: var(--accent-glow);
      border: 1px solid rgba(124,106,247,0.3);
    }

    .message.user .msg-avatar {
      background: #1e1e28;
      border: 1px solid var(--border);
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.7;
      max-width: 680px;
    }

    .message.bot .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .message.user .msg-bubble {
      background: var(--accent);
      color: white;
      border-top-right-radius: 4px;
    }

    /* TYPING */
    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 4px 2px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* INPUT */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within { border-color: rgba(124,106,247,0.5); }

    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
      color: white;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .input-hint {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 8px;
      padding: 0 2px;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside>
  <div class="sidebar-title">Personas</div>
  <div id="persona-list"></div>
</aside>

<!-- MAIN CHAT -->
<main>
  <div class="chat-header">
    <div class="active-persona">
      <div class="active-emoji" id="header-emoji">🧙</div>
      <div>
        <div class="active-name" id="header-name">Sage</div>
        <div class="active-tag" id="header-tag">Wise Mentor & Guide</div>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn">✦ Clear chat</button>
  </div>

  <div id="chat-box">
    <div class="welcome" id="welcome-msg">
      <span class="welcome-emoji" id="welcome-emoji">🧙</span>
      <h2 id="welcome-name">Hello, I'm Sage</h2>
      <p id="welcome-tag">Wise Mentor & Guide — ask me anything.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">➤</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</main>

<script>
  let currentPersona = 'wise_mentor';
  let personas = {};

  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');

  // Load personas from backend
  async function loadPersonas() {
    const res = await fetch('/personas');
    personas = await res.json();
    renderSidebar();
  }

  function renderSidebar() {
    const list = document.getElementById('persona-list');
    list.innerHTML = '';
    for (const [key, p] of Object.entries(personas)) {
      const btn = document.createElement('button');
      btn.className = 'persona-btn' + (key === currentPersona ? ' active' : '');
      btn.dataset.key = key;
      btn.innerHTML = `
        <span class="p-emoji">${p.emoji}</span>
        <div class="p-info">
          <span class="p-name">${p.name}</span>
          <span class="p-tag">${p.tagline}</span>
        </div>`;
      btn.addEventListener('click', () => switchPersona(key));
      list.appendChild(btn);
    }
  }

  function switchPersona(key) {
    currentPersona = key;
    const p = personas[key];

    // Update sidebar
    document.querySelectorAll('.persona-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.key === key);
    });

    // Update header
    document.getElementById('header-emoji').textContent = p.emoji;
    document.getElementById('header-name').textContent = p.name;
    document.getElementById('header-tag').textContent = p.tagline;

    // Clear chat and show welcome
    chatBox.innerHTML = `
      <div class="welcome" id="welcome-msg">
        <span class="welcome-emoji">${p.emoji}</span>
        <h2>Hello, I'm ${p.name}</h2>
        <p>${p.tagline} — ask me anything.</p>
      </div>`;

    userInput.focus();
  }

  function appendMessage(role, text, emoji) {
    document.getElementById('welcome-msg')?.remove();

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? (personas[currentPersona]?.emoji || '🤖') : '✦';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    document.getElementById('welcome-msg')?.remove();
    const msg = document.createElement('div');
    msg.className = 'message bot';
    msg.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = personas[currentPersona]?.emoji || '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, persona: currentPersona })
      });
      const data = await res.json();
      removeTyping();
      appendMessage('bot', data.response || 'Something went wrong.');
    } catch {
      removeTyping();
      appendMessage('bot', 'Connection error. Is Ollama running?');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: currentPersona })
    });
    const p = personas[currentPersona];
    chatBox.innerHTML = `
      <div class="welcome" id="welcome-msg">
        <span class="welcome-emoji">${p.emoji}</span>
        <h2>Hello, I'm ${p.name}</h2>
        <p>${p.tagline} — ask me anything.</p>
      </div>`;
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', sendMessage);

  loadPersonas();
</script>
</body>
</html>
